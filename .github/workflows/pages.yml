name: Build and deploy

on:
  push:
    branches: [main, rebuild-2026-12]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build, content gate, script budget
        run: npm run build
      - name: axe (WCAG AA, both modes)
        run: npm run audit:a11y
      - name: Lighthouse (mobile)
        run: npm run audit:lh
      - name: CNAME present
        run: test -f dist/CNAME && cat dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Deploys only from main. Pages source must be switched to "GitHub Actions" when this merges.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
